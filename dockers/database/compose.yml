services:
  database:
    image: postgres:16-alpine
    container_name: hackiathon_database
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "5432:5432"
    networks:
      - hackiathon_network
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
    driver: local

networks:
  hackiathon_network:
    external: true
